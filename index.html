<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历日程 - Apple风格值得拥有</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calendar-container">
        <!-- 顶部导航栏 -->
        <header class="calendar-header">
            <div class="header-controls">
                <button class="nav-button" id="prevMonth">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </button>
                <h1 id="currentMonth">2024年 3月</h1>
                <button class="nav-button" id="nextMonth">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
                    </svg>
                </button>
            </div>
            <div class="view-controls">
                <button class="view-button active">月</button>
                <button class="view-button">周</button>
                <button class="view-button">日</button>
            </div>
        </header>

        <!-- 日历主体 -->
        <div class="calendar-grid">
            <div class="weekdays">
                <div>日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div>六</div>
            </div>
            <div class="days" id="daysGrid"></div>
        </div>

        <!-- 添加事件按钮 -->
        <button class="add-event-button" id="addEvent">
            <svg width="24" height="24" viewBox="0 0 24 24">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
        </button>

        <!-- 事件弹窗 -->
        <div class="event-modal" id="eventModal">
            <div class="modal-content">
                <h2>添加新事件</h2>
                <input type="text" id="eventTitle" placeholder="事件标题">
                <input type="datetime-local" id="eventDateTime">
                <textarea id="eventDescription" placeholder="事件描述"></textarea>
                <div class="modal-buttons">
                    <button class="cancel-button" id="cancelEvent">取消</button>
                    <button class="save-button" id="saveEvent">保存</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
